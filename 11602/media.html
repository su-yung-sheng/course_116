<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多媒體專題：30 秒廣告 · 116-2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/cardgame.css">
<script src="config.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/seal.js"></script>
<script src="../shared/cardgame.js"></script>
<script src="../shared/labkit.js"></script>
<script src="content/media.js"></script>
<style>
  .mtabs{display:flex;gap:.5rem;margin-bottom:1rem}
  .mtab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.5rem 1rem;font-weight:900;cursor:pointer;color:var(--ink)}
  .mtab.on{border-color:var(--u1);background:var(--u1-bg);color:#1e40af}
  .steps{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr))}
  .step{border:2px solid var(--line);background:#fff;border-radius:.9rem;padding:.6rem .7rem;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .step.on{border-color:var(--u1);background:#eff6ff}
  .step .st{font-size:.75rem;font-weight:800;color:var(--ink-soft)}
  .step.done .st{color:var(--ok)}
  .shot{border:1px solid var(--line);border-radius:.9rem;padding:.8rem;background:var(--soft)}
  .shot .grid{gap:.6rem}
  .shot textarea{min-height:3.6rem;resize:vertical}
  .chk{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border:1px solid var(--line);border-radius:.7rem;background:#fff;cursor:pointer}
  .chk input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--ok)}
  .files{background:#0f172a;color:#e2e8f0;border-radius:.7rem;padding:.7rem .9rem;font:14px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap}
  .mtabs{flex-wrap:wrap}
  @media (max-width:560px){.tl .n{display:none}}
  @media (max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step{padding:.45rem .55rem}.step>div:first-child{font-size:1.1rem!important}}
  .rub td,.rub th{text-align:center}
  .rub td:first-child,.rub th:first-child{text-align:left}
  .cnt{font-size:.8rem;font-weight:800;color:var(--ink-soft)}
  .cnt.bad{color:var(--bad)} .cnt.ok{color:var(--ok)}
  .tl{display:flex;border-radius:.7rem;overflow:hidden;border:2px solid var(--line)}
  .tl>div{padding:.45rem .4rem;font-size:.75rem;font-weight:800;text-align:center;border-right:2px solid #fff;min-width:0}
  .tl>div:last-child{border-right:0}
  .tl .n{display:block;font-size:.7rem;font-weight:700;opacity:.85}
  .s0{background:#fee2e2}.s1{background:#ffedd5}.s2{background:#dbeafe}.s3{background:#ede9fe}.s4{background:#dcfce7}
  .shotrow{display:grid;gap:.5rem;grid-template-columns:2.2rem minmax(0,1.1fr) minmax(0,2fr) minmax(0,1fr) 4.2rem 2.4rem;align-items:end;padding:.5rem;border:1px solid var(--line);border-radius:.8rem;background:#fff}
  .shotrow .input{margin-top:.15rem;padding:.45rem .55rem}
  .shotrow .no{font-weight:900;text-align:center;padding-bottom:.55rem}
  @media (max-width:700px){.shotrow{grid-template-columns:2rem minmax(0,1fr) minmax(0,1fr)}.shotrow .what{grid-column:2/4}}
  .move{border:2px solid var(--line);border-radius:.9rem;padding:.8rem;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .move.on{border-color:var(--ok);background:var(--ok-bg)}
  .move .at{font-weight:900}
  .aicard{border:2px dashed var(--line);border-radius:1rem;padding:1rem;background:#fff}
  .aicard.ready{border-style:solid;border-color:var(--u1)}
  .plan{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  #card-canvas{max-width:100%;border-radius:.8rem;box-shadow:var(--shadow)}
  @media print{
    body *{visibility:hidden}
    #print-area,#print-area *{visibility:visible}
    #print-area{position:absolute;left:0;top:0;width:100%}
    #print-area input,#print-area textarea,#print-area select{border:0;padding:0;resize:none}
  }
</style>
</head>
<body>
<main class="wrap">
  <header id="topbar"></header>
  <nav class="mtabs" aria-label="切換">
    <button class="mtab on" data-t="games">🎮 概念闖關</button>
    <button class="mtab" data-t="demo">📺 看示範</button>
    <button class="mtab" data-t="ai">🤖 AI 前導關</button>
    <button class="mtab" data-t="studio">🎬 廣告工作站</button>
  </nav>
  <div id="games"></div>
  <div id="demo" class="hidden"></div>
  <div id="ai" class="hidden"></div>
  <div id="studio" class="hidden"></div>
</main>
<script>
(function () {
  var esc = UI.esc, MOD = 'media', STEPS = window.MEDIA_STEPS;
  UI.topbar('#topbar', { title: '🎬 多媒體專題：30 秒廣告', kicker: '單元四 · 3下 第 1 章' });
  CARDGAME.mount({ app: '#games', levels: MEDIA_LEVELS, mod: MOD, headline: '先看懂影片規格，再動手拍一支 30 秒廣告' });

  /* ── 分頁：概念闖關 → 看示範 → AI 前導關 → 廣告工作站 ── */
  var TABS = ['games', 'demo', 'ai', 'studio'];
  function tab(t) {
    document.querySelectorAll('.mtab').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    TABS.forEach(function (k) { document.getElementById(k).classList.toggle('hidden', k !== t); });
    if (t === 'studio') studio();
    if (t === 'demo') demo();
    if (t === 'ai') ai();
  }
  document.querySelectorAll('.mtab').forEach(function (b) { b.onclick = function () { tab(b.dataset.t); }; });

  function rec(id) { return STORE.level(MOD, id) || {}; }
  function done(id) { return !!rec(id).done; }
  function extra(id) { return rec(id).extra || {}; }
  function save(id, ex, isDone) {
    var r = STORE.saveLevel(MOD, id, { done: !!isDone, extra: ex });
    if (isDone && r.improved) UI.toast('✅ ' + STEPS.filter(function (s) { return s.id === id; })[0].title + ' 完成！');
    return r;
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function len(t) { return Array.from(String(t || '').replace(/\s/g, '')).length; }      // 字數（不算空白）
  function sel(id, opts, v) { return '<select class="input" id="' + id + '">' + opts.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>'; }
  function msgBox(el, ok, okText, miss) {
    el.innerHTML = ok ? '<div class="note ok small">' + okText + '</div>' : '<div class="note warn small">已暫存，但還不算完成 —— 還差：' + miss.map(esc).join('、') + '</div>';
  }

  /* ================================================================
     📺 看示範：出處＋手法拆解（影片不放進網站，老師課堂播放）
     ================================================================ */
  function demo() {
    var D = window.MEDIA_DEMO, box = document.getElementById('demo'), found = {};
    function draw() {
      var n = Object.keys(found).length;
      box.innerHTML = '<section class="card pop"><div class="tape"></div><p class="kicker">看示範 · 邊看邊找廣告手法</p>' +
        '<h2 class="black" style="font-size:1.3rem">《' + esc(D.title) + '》</h2>' +
        '<p class="small mt1">創作者：<b>' + esc(D.creator) + '</b>（' + esc(D.platform) + '）· 長度 ' + esc(D.length) +
        ' · <a href="' + esc(D.url) + '" target="_blank" rel="noopener">到創作者頁面看原作 ↗</a></p>' +
        '<p class="tiny soft mt1">🎥 影片是別人的作品，網站不放檔案，由老師在課堂播放。</p>' +
        '<div class="note warn small mt2">🤖 ' + esc(D.aiNote) + '</div></section>' +
        '<section class="card mt2"><div class="row between"><h3 class="bold">🔎 這支廣告用了哪些手法？看到就點一下</h3><span class="chip">找到 ' + n + ' / ' + D.moves.length + '</span></div>' +
        '<div class="grid g2 mt1">' + D.moves.map(function (m, i) {
          return '<button class="move' + (found[i] ? ' on' : '') + '" data-i="' + i + '"><div class="at">' + m.icon + ' ' + esc(m.at) + (found[i] ? ' ✅' : '') + '</div>' +
            '<div class="small mt1">' + esc(m.what) + '</div>' +
            (found[i] ? '<div class="small mt1">💡 ' + esc(m.why) + '</div><div class="tiny soft mt1">➡️ 我們的 30 秒：' + esc(m.ours) + '</div>' : '') + '</button>';
        }).join('') + '</div>' +
        (n === D.moves.length ? '<div class="note ok small mt2">🎉 八個手法都找到了！接下來想想：30 秒裡要留下哪幾個？</div>' : '') + '</section>' +
        '<section class="card mt2"><h3 class="bold">💭 想一想（課堂討論）</h3><ol class="mt1">' + D.think.map(function (t) { return '<li class="mt1">' + esc(t) + '</li>'; }).join('') + '</ol>' +
        '<div class="row mt2"><button class="btn primary" id="to-ai">下一步：🤖 AI 前導關 →</button></div></section>';
      box.querySelectorAll('.move').forEach(function (b) { b.onclick = function () { var i = +b.dataset.i; if (found[i]) delete found[i]; else found[i] = 1; draw(); }; });
      document.getElementById('to-ai').onclick = function () { tab('ai'); };
    }
    draw();
  }

  /* ================================================================
     🤖 AI 前導關（🚧 目前是關卡骨架：主題、學習目標、預計玩法）
     做好的關卡之後放進 MEDIA_AI_LEVELS，用 cardgame 引擎玩（見 content/media.js 說明）
     ================================================================ */
  var PLAN = { sort: '🗂️ 分類', order: '🔢 排序', build: '🧩 組合', type: '⌨️ 打字' };
  function ai() {
    var L = window.MEDIA_AI || [], box = document.getElementById('ai');
    var ready = L.filter(function (a) { return a.ready; }).length;
    box.innerHTML = '<section class="card pop"><div class="tape"></div><div class="row between"><div><p class="kicker">AI 前導關 · 和 AI 討論文案之前先闖這六關</p>' +
      '<h2 class="black" style="font-size:1.3rem">🤖 先認識 AI，再請它幫忙</h2>' +
      '<p class="small soft mt1">廣告工作站的步驟 2 要和 AI 一起想標語。AI 很好用，但它怎麼運作、會在哪裡出錯、哪些事不能做，要先弄清楚。</p></div>' +
      '<div class="center"><div class="black" style="font-size:1.8rem">' + ready + ' / ' + L.length + '</div><div class="tiny soft bold">已開放</div></div></div>' +
      (ready < L.length ? '<div class="note warn small mt2">🚧 這些關卡還在製作中，現在先看每一關要學什麼。完整的「AI 素養」系列之後會陸續開放。</div>' : '') + '</section>' +
      '<div class="grid g2 mt2">' + L.map(function (a) {
        return '<article class="aicard' + (a.ready ? ' ready' : '') + '"><div class="row between"><span class="chip">' + esc(a.id) + '</span>' +
          '<span class="chip">' + (a.ready ? '✅ 已開放' : '🚧 準備中') + '</span></div>' +
          '<h3 class="black mt1" style="font-size:1.15rem">' + a.icon + ' ' + esc(a.title) + '</h3>' +
          '<p class="bold small mt1">❓ ' + esc(a.question) + '</p>' +
          '<ul class="small mt1">' + a.goals.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul>' +
          '<div class="plan">' + a.plan.map(function (p) { return '<span class="chip" title="' + esc(p[1]) + '">' + (PLAN[p[0]] || p[0]) + '</span>'; }).join('') + '</div>' +
          '<ul class="tiny soft mt1">' + a.plan.map(function (p) { return '<li>' + esc(p[1]) + '</li>'; }).join('') + '</ul>' +
          '<p class="tiny mt1">🔗 ' + esc(a.link) + '</p></article>';
      }).join('') + '</div>' +
      '<div class="row mt2"><button class="btn primary" id="to-studio">前往 🎬 廣告工作站 →</button></div>';
    document.getElementById('to-studio').onclick = function () { tab('studio'); };
  }

  /* ================================================================
     🎬 30 秒廣告工作站
     ================================================================ */
  var cur = 0;
  function studio() {
    var box = document.getElementById('studio');
    var n = STEPS.filter(function (s) { return done(s.id); }).length;
    box.innerHTML = '<section class="card pop"><div class="tape"></div><div class="row between"><div><p class="kicker">廣告工作站 · 不計星 · 記錄完成</p>' +
      '<h2 class="black" style="font-size:1.35rem">拍一支 30 秒廣告：讓平凡物品變主角</h2>' +
      '<p class="small soft mt1">選題與文案 → 鏡頭清單 → 拍攝 → 剪輯配音 → 同儕試看。影片自己實拍、在電腦上剪；這裡幫你規劃、檢查、記錄。</p></div>' +
      '<div class="center"><div class="black" style="font-size:1.8rem">' + n + ' / ' + STEPS.length + '</div><div class="tiny soft bold">步驟完成</div></div></div>' +
      '<div class="steps mt2">' + STEPS.map(function (s, i) {
        return '<button class="step' + (i === cur ? ' on' : '') + (done(s.id) ? ' done' : '') + '" data-i="' + i + '"><div style="font-size:1.4rem">' + s.icon + '</div>' +
          '<div class="bold">' + (i + 1) + '. ' + esc(s.title) + '</div><div class="st">' + (done(s.id) ? '✅ 完成' : '尚未完成') + '</div></button>';
      }).join('') + '</div></section><section class="card mt2" id="panel"></section>';
    box.querySelectorAll('.step').forEach(function (b) { b.onclick = function () { cur = +b.dataset.i; studio(); }; });
    var s = STEPS[cur], panel = document.getElementById('panel');
    panel.innerHTML = '<h3 class="black" style="font-size:1.2rem">' + s.icon + ' ' + esc(s.title) + '</h3><p class="small soft mt1">' + esc(s.desc) + '</p><div id="body" class="mt2"></div>';
    var body = document.getElementById('body');
    ({ W1: topicStep, W2: copyStep, W3: shotStep, W4: shootStep, W5: finishStep })[s.id](body, s);
  }
  function next() { if (cur < STEPS.length - 1) cur++; setTimeout(studio, 900); }

  /* W1 選擇主題 */
  var FEEL = ['驚喜', '溫暖', '好笑', '帥氣', '安心', '療癒', '懷念'];
  function topicStep(body) {
    var ex = extra('W1');
    body.innerHTML = '<div class="grid g2">' +
      '<label class="field">🎯 主角是（一項物品）<input class="input" id="w1-obj" maxlength="10" value="' + esc(ex.obj || '') + '" placeholder="例：塑膠椅、水壺、雨傘、書包"></label>' +
      '<label class="field">👥 想給誰看？<input class="input" id="w1-who" maxlength="12" value="' + esc(ex.who || '') + '" placeholder="例：同學、爸媽、通勤的上班族"></label></div>' +
      '<label class="field mt1">大家通常覺得它…<input class="input" id="w1-usual" maxlength="24" value="' + esc(ex.usual || '') + '" placeholder="例：很普通，隨便一張而已"></label>' +
      '<label class="field mt1">我想讓觀眾發現它…（只挑一個特色）<input class="input" id="w1-find" maxlength="24" value="' + esc(ex.find || '') + '" placeholder="例：輕到可以帶去任何地方"></label>' +
      '<label class="field mt1">看完想讓觀眾有什麼感受？（只選一種）' + sel('w1-feel', FEEL, ex.feel || '驚喜') + '</label>' +
      '<div class="note small mt2" id="w1-pre"></div>' +
      '<p class="tiny soft mt1">💡 好主角：容易取得、可以從不同角度拍（上面、側面、特寫、有人在用）。</p>' +
      '<div class="row mt2"><button class="btn go" id="w1-sv">💾 儲存</button></div><div id="w1-msg" class="mt1"></div>';
    function pre() {
      document.getElementById('w1-pre').innerHTML = '📝 主角是 <b>' + esc(val('w1-obj') || '＿＿') + '</b>；大家通常覺得它 <b>' + esc(val('w1-usual') || '＿＿') +
        '</b>；我想讓觀眾發現它 <b>' + esc(val('w1-find') || '＿＿') + '</b>，看完覺得 <b>' + esc(val('w1-feel')) + '</b>。';
    }
    body.querySelectorAll('input,select').forEach(function (e) { e.oninput = pre; e.onchange = pre; });
    pre();
    document.getElementById('w1-sv').onclick = function () {
      var v = { obj: val('w1-obj'), who: val('w1-who'), usual: val('w1-usual'), find: val('w1-find'), feel: val('w1-feel') }, miss = [];
      if (!v.obj) miss.push('主角');
      if (!v.who) miss.push('想給誰看');
      if (len(v.usual) < 2) miss.push('大家通常覺得它');
      if (len(v.find) < 2) miss.push('我想讓觀眾發現它');
      save('W1', v, !miss.length);
      msgBox(document.getElementById('w1-msg'), !miss.length, '✅ 主題決定了！下一步：寫文案。', miss);
      if (!miss.length) next();
    };
  }

  /* W2 文案生成（和 AI 討論） */
  var TONE = ['溫暖', '幽默', '酷', '優雅', '活潑', '感性'];
  var HYPE = /最|第一|唯一|100%|百分之百|保證|永遠|全世界|世界級|無敵|神級|絕對/;
  function copyStep(body) {
    var ex = extra('W2'), w1 = extra('W1'), f = ex.feats || ['', '', ''];
    body.innerHTML = (done('W1') ? '' : '<div class="note warn small">先完成步驟 1「選擇主題」，這裡會自動帶入主角和觀眾。</div>') +
      '<p class="bold">① 列出 3 個「看得見」的特點，選最有畫面的一個</p><div class="stack mt1">' + [0, 1, 2].map(function (i) {
        return '<div class="row" style="flex-wrap:nowrap"><input type="radio" name="w2-pick" value="' + i + '"' + (ex.pick === i ? ' checked' : '') + ' aria-label="選第 ' + (i + 1) + ' 個特點" style="width:1.2rem;height:1.2rem">' +
          '<input class="input" id="w2-f' + i + '" maxlength="20" value="' + esc(f[i] || '') + '" placeholder="' + ['例：輕巧、方便搬動', '例：可以疊起來收', '例：有很多顏色'][i] + '" style="margin-top:0"></div>';
      }).join('') + '</div><p class="tiny soft mt1">左邊的圓圈選「最有畫面」的那一個 —— 拍得出來的特點才能變成廣告。</p>' +
      '<p class="bold mt3">② 請 AI 幫忙發想標語</p>' +
      '<div class="note small mt1">🤖 還沒闖 <a href="#" id="w2-ai">AI 前導關</a>？先看看 AI 會在哪裡出錯、哪些事不能做。<br>⚠️ <b>不要</b>把自己或同學的姓名、照片、學校、電話貼給 AI。</div>' +
      '<div class="grid g2 mt1"><label class="field">對象<input class="input" id="w2-who" maxlength="12" value="' + esc(ex.who || w1.who || '') + '"></label>' +
      '<label class="field">語氣' + sel('w2-tone', TONE, ex.tone || '溫暖') + '</label></div>' +
      '<p class="small bold mt2">📋 提示詞（可以直接複製給 AI）</p><div class="files mt1" id="w2-prompt"></div>' +
      '<div class="row mt1"><button class="btn sm" id="w2-copy">📋 複製提示詞</button><span id="w2-copied" class="tiny soft"></span></div>' +
      '<label class="field mt2">用了哪個 AI 工具？（沒用就寫「沒有用 AI」）<input class="input" id="w2-tool" maxlength="20" value="' + esc(ex.tool || '') + '" placeholder="例：老師指定的 AI 工具"></label>' +
      '<label class="field mt1">AI 給的標語（貼上來，選填）<textarea class="input" id="w2-cands" rows="4" placeholder="把 AI 回答的 5 句貼在這裡，方便比較">' + esc(ex.cands || '') + '</textarea></label>' +
      '<p class="bold mt3">③ 選一句，依實際畫面修改成你的主標語</p>' +
      '<label class="field">主標語 <span class="cnt" id="w2-sc"></span><input class="input" id="w2-slogan" maxlength="24" value="' + esc(ex.slogan || '') + '" placeholder="例：想坐哪裡，就坐哪裡。"></label>' +
      '<div id="w2-hype" class="mt1"></div>' +
      '<label class="field mt1">我怎麼修改的？為什麼？<input class="input" id="w2-edit" maxlength="40" value="' + esc(ex.edit || '') + '" placeholder="例：把「超級無敵輕」改掉，因為太誇張，而且畫面拍得出「搬來搬去」"></label>' +
      '<p class="bold mt3">④ 旁白或字幕</p><div class="row">' +
      '<label class="chk"><input type="radio" name="w2-mode" value="narr"' + (ex.mode !== 'sub' ? ' checked' : '') + '><span>有旁白（50～70 字）</span></label>' +
      '<label class="chk"><input type="radio" name="w2-mode" value="sub"' + (ex.mode === 'sub' ? ' checked' : '') + '><span>只用少量字幕＋音樂</span></label></div>' +
      '<label class="field mt1"><span id="w2-nlabel"></span> <span class="cnt" id="w2-nc"></span><textarea class="input" id="w2-narr" rows="3">' + esc(ex.narr || '') + '</textarea></label>' +
      '<div class="row mt2"><button class="btn go" id="w2-sv">💾 儲存文案</button></div><div id="w2-msg" class="mt1"></div>';
    function pick() { var r = document.querySelector('input[name=w2-pick]:checked'); return r ? +r.value : -1; }
    function mode() { return (document.querySelector('input[name=w2-mode]:checked') || {}).value || 'narr'; }
    function prompt() {
      var p = pick(), feat = p >= 0 ? val('w2-f' + p) : '';
      return '請為' + (w1.obj || '＿＿') + '寫 5 句廣告標語；對象：' + (val('w2-who') || '＿＿') + '；特色：' + (feat || '＿＿') + '；語氣：' + val('w2-tone') +
        '；每句不超過 15 字，避免誇大。';
    }
    function upd() {
      document.getElementById('w2-prompt').textContent = prompt();
      var sl = len(val('w2-slogan')), sc = document.getElementById('w2-sc');
      sc.textContent = sl + ' / 15 字'; sc.className = 'cnt ' + (sl === 0 ? '' : sl <= 15 ? 'ok' : 'bad');
      var h = val('w2-slogan').match(HYPE);
      document.getElementById('w2-hype').innerHTML = h ? '<div class="note warn small">「' + esc(h[0]) + '」聽起來有點誇大，畫面真的拍得出來嗎？可以換個說法。</div>' : '';
      var m = mode(), nl = len(val('w2-narr')), nc = document.getElementById('w2-nc');
      document.getElementById('w2-nlabel').textContent = m === 'narr' ? '旁白稿' : '字幕（每行一句）';
      nc.textContent = m === 'narr' ? nl + ' 字（50～70）' : '';
      nc.className = 'cnt ' + (m !== 'narr' || nl === 0 ? '' : (nl >= 50 && nl <= 70 ? 'ok' : 'bad'));
    }
    body.querySelectorAll('input,select,textarea').forEach(function (e) { e.addEventListener('input', upd); e.addEventListener('change', upd); });
    upd();
    document.getElementById('w2-ai').onclick = function (e) { e.preventDefault(); tab('ai'); };
    document.getElementById('w2-copy').onclick = function () {
      var t = prompt(), out = document.getElementById('w2-copied');
      try { navigator.clipboard.writeText(t).then(function () { out.textContent = '✅ 已複製'; }, function () { out.textContent = '請手動選取上面的文字複製'; }); }
      catch (e) { out.textContent = '請手動選取上面的文字複製'; }
    };
    document.getElementById('w2-sv').onclick = function () {
      var v = { feats: [val('w2-f0'), val('w2-f1'), val('w2-f2')], pick: pick(), who: val('w2-who'), tone: val('w2-tone'), tool: val('w2-tool'),
        cands: val('w2-cands'), slogan: val('w2-slogan'), edit: val('w2-edit'), mode: mode(), narr: val('w2-narr') }, miss = [];
      if (v.feats.some(function (x) { return len(x) < 2; })) miss.push('3 個特點');
      if (v.pick < 0) miss.push('選一個最有畫面的特點');
      if (!v.tool) miss.push('用了哪個 AI 工具');
      var sl = len(v.slogan); if (!sl || sl > 15) miss.push('主標語（1～15 字）');
      if (len(v.edit) < 4) miss.push('我怎麼修改的');
      var nl = len(v.narr);
      if (v.mode === 'narr' ? (nl < 50 || nl > 70) : nl < 2) miss.push(v.mode === 'narr' ? '旁白（50～70 字）' : '字幕');
      save('W2', v, !miss.length);
      msgBox(document.getElementById('w2-msg'), !miss.length, '✅ 文案完成！主標語：「' + esc(v.slogan) + '」。下一步：列鏡頭清單。', miss);
      if (!miss.length) next();
    };
  }

  /* W3 鏡頭清單：30 秒分成五個時段 */
  var SEGS = [
    { t: '0–3 秒', what: '物品特寫或有趣動作', aim: '抓住注意', sec: 3 },
    { t: '3–8 秒', what: '材質、外形、細節', aim: '認識主角', sec: 5 },
    { t: '8–18 秒', what: '人物使用或移動物品', aim: '呈現特色', sec: 10 },
    { t: '18–25 秒', what: '最有情緒或趣味的畫面', aim: '加深印象', sec: 7 },
    { t: '25–30 秒', what: '物品全景＋一句主標語', aim: '留下記憶', sec: 5 }
  ];
  var ANGLE = ['特寫', '中景', '遠景', '低角度', '俯拍', '跟拍'];
  function shots() {
    var d = null; try { d = JSON.parse(STORE.draft('media-shots') || 'null'); } catch (e) {}
    return d || extra('W3').shots || [0, 1, 1, 2, 2, 2, 3, 4].map(function (g, i) { return { seg: g, what: '', angle: [ '特寫', '特寫', '中景', '中景', '低角度', '遠景', '中景', '遠景'][i], sec: 3 }; });
  }
  function sumSec(sh) { return sh.reduce(function (a, x) { return a + (+x.sec || 0); }, 0); }
  function shotStep(body) {
    var sh = shots(), w1 = extra('W1'), w2 = extra('W2');
    function draw() {
      var tot = sumSec(sh), per = SEGS.map(function (_, g) { return sumSec(sh.filter(function (x) { return +x.seg === g; })); });
      body.innerHTML = '<div id="print-area"><p class="bold">30 秒廣告 · 鏡頭清單　<span class="small soft">主角：' + esc(w1.obj || '＿＿') + '　主標語：' + esc(w2.slogan || '＿＿') + '　' +
        esc((STORE.me() || {}).cls || '') + ' 班 ' + esc((STORE.me() || {}).seat || '') + ' 號 ' + esc((STORE.me() || {}).name || '') + '</span></p>' +
        '<div class="tl mt1">' + SEGS.map(function (g, i) {
          return '<div class="s' + i + '" style="flex:' + g.sec + '">' + esc(g.t) + '<span class="n">' + esc(g.aim) + '・已排 ' + per[i] + ' 秒</span></div>';
        }).join('') + '</div>' +
        '<div class="scroll-x mt1"><table class="t small"><tr><th>時段</th><th>拍攝內容</th><th>目的</th></tr>' + SEGS.map(function (g, i) {
          return '<tr><td class="s' + i + '">' + esc(g.t) + '</td><td>' + esc(g.what) + '</td><td>' + esc(g.aim) + '</td></tr>'; }).join('') + '</table></div>' +
        '<div class="stack mt2">' + sh.map(function (x, i) {
          return '<div class="shotrow"><div class="no">#' + (i + 1) + '</div>' +
            '<label class="tiny bold">時段<select class="input" data-k="seg" data-i="' + i + '">' + SEGS.map(function (g, k) { return '<option value="' + k + '"' + (+x.seg === k ? ' selected' : '') + '>' + g.t + '</option>'; }).join('') + '</select></label>' +
            '<label class="tiny bold what">拍什麼<input class="input" data-k="what" data-i="' + i + '" value="' + esc(x.what) + '" placeholder="例：手指滑過椅面的紋路"></label>' +
            '<label class="tiny bold">角度<select class="input" data-k="angle" data-i="' + i + '">' + ANGLE.map(function (a) { return '<option' + (a === x.angle ? ' selected' : '') + '>' + a + '</option>'; }).join('') + '</select></label>' +
            '<label class="tiny bold">秒數<input class="input" type="number" min="1" max="8" data-k="sec" data-i="' + i + '" value="' + esc(x.sec) + '"></label>' +
            (sh.length > 1 ? '<button class="btn sm no-print" data-del="' + i + '" aria-label="刪除第 ' + (i + 1) + ' 個鏡頭">✕</button>' : '<span></span>') + '</div>';
        }).join('') + '</div></div>' +
        '<div class="row mt2 no-print">' + (sh.length < 12 ? '<button class="btn" id="add">＋ 新增鏡頭</button>' : '') +
        '<span class="bold">共 ' + sh.length + ' 個鏡頭・總長 <span id="tot"' + (tot < 26 || tot > 34 ? ' style="color:var(--bad)"' : '') + '>' + tot + ' 秒</span></span><span class="tiny soft">（8～12 個鏡頭、約 30 秒）</span></div>' +
        '<div class="row mt2 no-print"><button class="btn go" id="sv">💾 儲存鏡頭清單</button><button class="btn" id="pr">🖨️ 列印／存成 PDF</button></div><div id="msg" class="mt1"></div>';
      body.querySelectorAll('[data-k]').forEach(function (el) {
        var k = el.dataset.k;
        el.oninput = function () { sh[+el.dataset.i][k] = (k === 'sec' || k === 'seg') ? (+el.value || 0) : el.value; STORE.draft('media-shots', JSON.stringify(sh)); };
        if (k !== 'what') el.onchange = function () { el.oninput(); draw(); };   // 換時段、角度、秒數才重畫（打字時不重畫，游標才不會跳掉）
      });
      body.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { sh.splice(+b.dataset.del, 1); STORE.draft('media-shots', JSON.stringify(sh)); draw(); }; });
      var add = document.getElementById('add'); if (add) add.onclick = function () { sh.push({ seg: 2, what: '', angle: '中景', sec: 3 }); STORE.draft('media-shots', JSON.stringify(sh)); draw(); };
      document.getElementById('pr').onclick = function () { window.print(); };
      document.getElementById('sv').onclick = function () {
        var filled = sh.filter(function (x) { return len(x.what) >= 2; }), miss = [], t = sumSec(sh);
        if (filled.length < 8 || sh.length > 12) miss.push('8～12 個寫好內容的鏡頭（目前 ' + filled.length + ' 個）');
        SEGS.forEach(function (g, k) { if (!filled.some(function (x) { return +x.seg === k; })) miss.push(g.t + ' 至少一個鏡頭'); });
        if (!sh.some(function (x) { return x.angle === '遠景'; })) miss.push('一個遠景');
        if (!sh.some(function (x) { return x.angle === '特寫'; })) miss.push('一個特寫');
        if (sh.some(function (x) { return x.sec < 2 || x.sec > 4; })) miss.push('每個鏡頭 2～4 秒');
        if (t < 26 || t > 34) miss.push('總長約 30 秒（目前 ' + t + ' 秒）');
        save('W3', { shots: sh }, !miss.length);
        msgBox(document.getElementById('msg'), !miss.length, '✅ 鏡頭清單完成！印出來帶去拍攝吧。', miss);
        if (!miss.length) next();
      };
    }
    draw();
  }

  /* W4 拍攝：前面步驟的檢查＋實拍檢核表 */
  function shootStep(body, s) {
    var w2 = extra('W2');
    var pre = [['主題與觀眾清楚', done('W1')], ['只有一個核心特色', done('W1') && done('W2')], ['主標語簡短（≤ 15 字）', done('W2') && len(w2.slogan) <= 15], ['已列 8～12 個鏡頭', done('W3')]];
    body.innerHTML = '<p class="bold small">📋 拍攝前檢查（從前面的步驟自動帶入）</p><div class="row mt1">' +
      pre.map(function (p) { return '<span class="chip"' + (p[1] ? ' style="background:var(--ok-bg);border-color:var(--ok)"' : '') + '>' + (p[1] ? '✅ ' : '⬜ ') + esc(p[0]) + '</span>'; }).join('') + '</div>' +
      (pre.every(function (p) { return p[1]; }) ? '' : '<p class="tiny soft mt1">還有⬜的，先回到前面的步驟完成。</p>') +
      '<p class="bold small mt2">🎥 實拍檢核（拍完一項勾一項）</p><div id="cl" class="mt1"></div>';
    checklist(document.getElementById('cl'), s);
  }

  /* 通用檢核表：全部打勾才完成（「（挑戰）」開頭的可以不做） */
  function checklist(body, s) {
    var st = extra(s.id).checks || [];
    body.innerHTML = '<div class="stack">' + s.checks.map(function (c, i) {
      return '<label class="chk"><input type="checkbox" data-i="' + i + '"' + (st[i] ? ' checked' : '') + '><span>' + esc(c) + '</span></label>';
    }).join('') + '</div><div id="cmsg" class="mt2"></div>';
    body.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
      cb.onchange = function () {
        st[+cb.dataset.i] = cb.checked;
        var need = s.checks.filter(function (c) { return !/^（挑戰）/.test(c); }).length;
        var got = s.checks.filter(function (c, i) { return st[i] && !/^（挑戰）/.test(c); }).length;
        var ok = got >= need;
        save(s.id, { checks: st }, ok);
        document.getElementById('cmsg').innerHTML = ok ? '<div class="note ok small">✅ 這一步完成了！</div>' : '<p class="tiny soft">還有 ' + (need - got) + ' 項（「挑戰」那項可以不做）</p>';
        if (ok) next();
      };
    });
  }

  /* W5 剪輯・同儕試看・修正・AI 使用聲明 → 作品說明卡 */
  var PEER = ['前三秒，你想看下去嗎？', '看完，你知道它的特色是什麼嗎？', '你記得最後那一句標語嗎？'];
  var ANS = ['是', '有一點', '不是'];
  var FIX = ['刪去重複的畫面', '縮短文案', '加強結尾', '調整字幕或音量'];
  var AIUSE = ['標語發想', '旁白稿', '配樂或音效', '畫面或影片生成', '沒有使用 AI'];
  function finishStep(body) {
    var ex = extra('W5'), w1 = extra('W1'), w2 = extra('W2'), me = STORE.me() || {};
    function checks(name, list, on) { return list.map(function (t, i) { return '<label class="chk"><input type="checkbox" name="' + name + '" value="' + i + '"' + ((on || []).indexOf(i) >= 0 ? ' checked' : '') + '><span>' + esc(t) + '</span></label>'; }).join(''); }
    body.innerHTML = '<p class="bold">① 剪輯</p><div class="grid g3 mt1">' +
      '<label class="field">剪輯軟體' + sel('w5-app', ['Shotcut', '剪映', 'iMovie', '其他'], ex.app || 'Shotcut') + '</label>' +
      '<label class="field">影片長度（秒）<input class="input" type="number" id="w5-len" min="1" max="120" value="' + esc(ex.len || '') + '" placeholder="30"></label>' +
      '<label class="field">畫面比例' + sel('w5-ratio', ['16:9 橫式', '9:16 直式'], ex.ratio || '16:9 橫式') + '</label></div>' +
      '<p class="bold mt3">② 同儕試看：請一位同學看完回答</p>' +
      '<label class="field">試看的同學（座號或名字）<input class="input" id="w5-peer" maxlength="12" value="' + esc(ex.peer || '') + '"></label>' +
      '<div class="scroll-x"><table class="t rub mt1"><tr><th>問題</th>' + ANS.map(function (a) { return '<th>' + a + '</th>'; }).join('') + '</tr>' +
      PEER.map(function (q, i) { return '<tr><td>' + esc(q) + '</td>' + ANS.map(function (a, k) { return '<td><input type="radio" name="pq' + i + '" value="' + k + '"' + ((ex.pa || [])[i] === k ? ' checked' : '') + ' aria-label="' + esc(q) + ' ' + a + '"></td>'; }).join('') + '</tr>'; }).join('') +
      '</table></div>' +
      '<p class="bold mt3">③ 依回答修正（不必靠複雜特效）</p><div class="stack mt1">' + checks('w5-fix', FIX, ex.fix) + '</div>' +
      '<label class="field mt1">我改了什麼？（三題都「是」的話，寫為什麼不用改）<input class="input" id="w5-what" maxlength="40" value="' + esc(ex.what || '') + '"></label>' +
      '<p class="bold mt3">④ AI 使用聲明：這支廣告哪些地方用了 AI？</p><div class="stack mt1">' + checks('w5-ai', AIUSE, ex.ai) + '</div><div id="w5-aiw" class="mt1"></div>' +
      '<div class="row mt2"><button class="btn go" id="w5-make">🎨 產生作品說明卡</button></div><p id="w5-err" class="small bold mt1" style="color:var(--bad)"></p><div id="w5-out" class="center mt2"></div>';
    function picked(name) { return Array.from(document.querySelectorAll('input[name=' + name + ']:checked')).map(function (c) { return +c.value; }); }
    function aiWarn() {
      var a = picked('w5-ai'), t = [];
      if (a.indexOf(4) >= 0 && a.length > 1) t.push('勾了「沒有使用 AI」，就不能再勾其他項目。');
      if (a.indexOf(3) >= 0) t.push('這次的作業要自己實拍；AI 生成的畫面要在作品裡清楚標示，並先和老師討論。');
      document.getElementById('w5-aiw').innerHTML = t.length ? '<div class="note warn small">' + t.map(esc).join('<br>') + '</div>' : '';
      return !(a.indexOf(4) >= 0 && a.length > 1);
    }
    body.querySelectorAll('input[name=w5-ai]').forEach(function (c) { c.onchange = aiWarn; });
    aiWarn();
    document.getElementById('w5-make').onclick = function () {
      var v = { app: val('w5-app'), len: +val('w5-len') || 0, ratio: val('w5-ratio'), peer: val('w5-peer'),
        pa: PEER.map(function (_, i) { var r = document.querySelector('input[name=pq' + i + ']:checked'); return r ? +r.value : -1; }),
        fix: picked('w5-fix'), what: val('w5-what'), ai: picked('w5-ai') }, miss = [];
      if (v.len < 25 || v.len > 35) miss.push('影片長度約 30 秒（25～35）');
      if (!v.peer) miss.push('試看的同學');
      if (v.pa.some(function (x) { return x < 0; })) miss.push('三題試看都要回答');
      if (len(v.what) < 4) miss.push('我改了什麼');
      if (!v.ai.length) miss.push('AI 使用聲明（沒用也要勾「沒有使用 AI」）');
      if (!aiWarn()) miss.push('AI 使用聲明（看上面的提醒）');
      if (!done('W2')) miss.push('先完成步驟 2 的主標語');
      document.getElementById('w5-err').textContent = miss.length ? '還差：' + miss.join('、') : '';
      if (miss.length) { save('W5', v, false); return; }
      var yes = v.pa.filter(function (x) { return x === 0; }).length, n = (extra('W3').shots || []).length;
      var decl = v.ai.indexOf(4) >= 0 ? '沒有使用 AI' : 'AI 協助：' + v.ai.map(function (i) { return AIUSE[i]; }).join('、') + '（主標語經我修改）';
      LABKIT.showCard(document.getElementById('w5-out'), LABKIT.drawCard({
        title: w2.slogan, banner: '30 秒廣告 · 主角：' + (w1.obj || ''), me: me,
        rule: v.app + ' · ' + v.len + ' 秒 · ' + v.ratio + ' · ' + n + ' 個鏡頭 · 試看者 ' + v.peer,
        boxes: [['主角', w1.obj || ''], ['長度', v.len + ' 秒'], ['鏡頭', n + ' 個'], ['試看', yes + ' / 3 題「是」']],
        lines: [('想讓你發現它' + (w1.find || '')).slice(0, 34), ('看完覺得' + (w1.feel || '') + '；對象：' + (w1.who || '')).slice(0, 34), decl.slice(0, 34)] }), me);
      var a = document.querySelector('#w5-out a'); if (a) a.download = '廣告說明卡-' + me.cls + '_' + me.seat + '_' + me.name + '.png';
      save('W5', v, true);
    };
  }

  /* 網址 #W3 → 工作站第 3 步；#ai、#demo → 對應分頁 */
  function route() {
    var h = location.hash;
    if (/^#W/.test(h)) { var wi = STEPS.findIndex(function (s) { return '#' + s.id === h; }); if (wi >= 0) cur = wi; tab('studio'); }
    else if (h === '#ai' || /^#A\d/.test(h)) tab('ai');
    else if (h === '#demo') tab('demo');
  }
  route();
  window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
