<script>
UI.topbar('#topbar', { title: '🗂️ 單元六：進階資料處理', kicker: '3下 第 3 章 · 三個部分' });
UI.requireLogin(function () {
  var u = UNIT.find('unit6'), esc = UI.esc;
  var got = u.parts.reduce(function (a, p) { return a + STORE.moduleStars(p.id); }, 0);
  document.getElementById('intro').innerHTML = '<div class="tape"></div><div class="row between"><div>' +

  UNIT.cards('#ucards', 'unit6', null);
  document.getElementById('tips').innerHTML = '<h3 class="bold">🧭 建議順序</h3><ol class="small mt1">' +
    '<li><b>資料偵探</b>：先懂大數據、資料清理、檔案轉換，最後用轉盤玩一下凱薩密碼（對應課本 3-1、3-2）。</li>' +

    '<li><b>密碼特務</b>：不寫程式，一步一步把加密、解密、暴力破解弄懂，最後統計全班作答。題目每次隨機，依序開放。</li></ol>';
});
